<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="بصائرنا">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120F"/>
      <stop offset="1" stop-color="#02090A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21C0A6"/>
      <stop offset="1" stop-color="#0A6455"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D68A"/>
      <stop offset=".5" stop-color="#E3B457"/>
      <stop offset="1" stop-color="#A9761F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- an open book: two pages meeting at the spine -->
  <g transform="translate(0 14)">
    <path d="M256 168c-38-34-92-52-146-52v210c54 0 108 18 146 52z"
          fill="url(#teal)"/>
    <path d="M256 168c38-34 92-52 146-52v210c-54 0-108 18-146 52z"
          fill="url(#teal)" opacity=".82"/>
    <path d="M256 168c-38-34-92-52-146-52v210c54 0 108 18 146 52z
             M256 168c38-34 92-52 146-52v210c-54 0-108 18-146 52z"
          fill="none" stroke="url(#gold)" stroke-width="13" stroke-linejoin="round"/>
    <path d="M256 168v210" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

    <!-- lines of text on each page -->
    <g stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity=".62">
      <path d="M150 176h68M150 214h74M150 252h60"/>
      <path d="M294 176h68M290 214h74M294 252h60"/>
    </g>
  </g>

  <!-- the dot of the logotype -->
  <circle cx="256" cy="424" r="15" fill="url(#gold)"/>
</svg>
